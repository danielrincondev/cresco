services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    userns_mode: keep-id
    command: sleep infinity
    working_dir: /workspace/cresco
    volumes:
      - ../:/workspace/cresco:cached,z
    environment:
      DATABASE_URL: postgresql://cresco_app:cresco_app_dev@db:5432/cresco
      DATABASE_MIGRATION_URL: postgresql://cresco_admin:cresco_admin_dev@db:5432/cresco
      BETTER_AUTH_SECRET: dev-only-change-me-cresco-auth-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: google-oauth-development-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: google-oauth-development-placeholder
      REVENUECAT_API_KEY: revenuecat-development-placeholder
      REVENUECAT_WEBHOOK_SECRET: revenuecat-webhook-development-placeholder
      EXPO_PUBLIC_API_URL: http://localhost:3000/api/v1
      PORT: "3000"
      MOBILE_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: cresco
      POSTGRES_USER: cresco_admin
      POSTGRES_PASSWORD: cresco_admin_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-cresco-roles.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cresco_admin -d cresco"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
